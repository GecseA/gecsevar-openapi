ClientDto:
  type: object
  properties:
    id:
      type: string
      example: [ client_123 ]
    fullName:
      type: string
      example: [ "Alex Driver" ]
    email:
      type: string
      format: email
      example: [ "alex.driver@example.com" ]
    phone:
      type: string
      example: [ "+36-30-123-4567" ]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required: [ id, fullName, createdAt, updatedAt ]

ClientCreateDto:
  type: object
  properties:
    fullName:
      type: string
      minLength: 1
    email:
      type: string
      format: email
    phone:
      type: string
  required: [ fullName ]

ClientUpdateDto:
  type: object
  properties:
    fullName:
      type: string
      minLength: 1
    email:
      type: string
      format: email
    phone:
      type: string

ClientListDto:
  type: object
  description: 'List of clients'
  properties:
    items:
      type: array
      items:
        $ref: '../../../SplittedExample.yml#/components/schemas/ClientDto'
    total:
      type: integer
      minimum: 0
  required: [ items, total ]
